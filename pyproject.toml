[project]
name = "uplift"
version = "0.1.0"
description = "Uplift modeling for coupon targeting: predict who a discount actually persuades."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Causal / ML stack (Phase 1-3)
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "econml>=0.15",
    "scikit-uplift>=0.5",
    "pandera>=0.18",
    "matplotlib>=3.8",
]
# Experiment tracking & pipelines (Phase 4)
mlops = [
    "mlflow>=2.12",
    "dvc>=3.48",
    "optuna>=3.6",
]
# Online serving (Phase 5)
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
# Dashboard (Phase 6)
app = [
    "streamlit>=1.33",
    "plotly>=5.20",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=uplift --cov-report=term-missing"
markers = [
    "slow: long-running tests (full training / large data)",
    "integration: tests touching external services or full pipelines",
]
